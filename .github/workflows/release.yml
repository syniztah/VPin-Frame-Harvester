name: Build Windows release

# Runs when you push a version tag (v1.0.0, v1.1.0 ...) or when you press
# "Run workflow" on the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Run the offline tests
        continue-on-error: true
        run: python tests/test_offline.py

      - name: Build the app (VPinFrameHarvester.exe)
        run: >
          pyinstaller app.py --noconfirm --windowed --onedir
          --name VPinFrameHarvester --icon assets/icon.ico
          --add-data "assets;assets" --hidden-import olefile

      - name: Build the worker (harvest.exe)
        run: >
          pyinstaller harvest.py --noconfirm --console --onefile
          --name harvest --icon assets/icon.ico
          --hidden-import olefile --hidden-import PIL.Image --hidden-import PIL.ImageDraw

      - name: Put the release folder together
        shell: pwsh
        run: |
          $dst = "dist/VPinFrameHarvester"
          Copy-Item dist/harvest.exe $dst/
          Copy-Item games $dst/games -Recurse
          Get-ChildItem $dst/games -Filter *.script.vbs | Remove-Item
          Copy-Item README.md, LICENSE $dst/
          Compress-Archive -Path $dst -DestinationPath VPinFrameHarvester-windows.zip

      - name: Keep the zip on the run page
        uses: actions/upload-artifact@v4
        with:
          name: VPinFrameHarvester-windows
          path: VPinFrameHarvester-windows.zip

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VPinFrameHarvester-windows.zip
          generate_release_notes: true
